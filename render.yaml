# Mantenido a mano. La API (servicio web) y el backoffice (static site) comparten los workspaces
# de yarn y el yarn.lock de la raíz. El esquema llega por la dependencia @bextia/api (repo bextia-api).
# El static site se crea en Render con aprobación.
services:
  - type: web
    name: bextia-agentes-api
    runtime: node
    plan: starter
    region: frankfurt
    buildCommand: yarn install --frozen-lockfile
    # Migraciones en cada deploy (P14); DATABASE_URL_DIRECT = conexión de sesión (5432).
    preDeployCommand: yarn workspace @bextia/agents db:migrate:deploy
    startCommand: yarn workspace @bextia/agents start
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_DIRECT
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: EMBED_SECRET
        sync: false
      - key: LEADS_WEBHOOK_URL
        sync: false
      - key: LEADS_WEBHOOK_SECRET
        sync: false
      - key: BACKOFFICE_URL
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: DEFAULT_MARKET
        value: ES
      # Debe incluir la URL del static site bextia-backoffice (se completa a mano al crearlo).
      - key: CORS_ORIGINS
        sync: false
      - key: SIMULATOR_ENABLED
        value: "false"
      - key: EMAIL_WEBHOOK_SECRET
        generateValue: true
      - key: FORM_WEBHOOK_SECRET
        generateValue: true
      - key: WIDGET_TOKEN_SECRET
        generateValue: true
      - key: IMPORT_TOKEN
        generateValue: true
      - key: IMPORT_EMAIL_SECRET
        generateValue: true
      - key: WHATSAPP_APP_SECRET
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "465"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  - type: web
    runtime: static
    name: bextia-backoffice
    buildCommand: yarn install --frozen-lockfile && yarn workspace @bextia/backoffice build
    staticPublishPath: apps/backoffice/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; connect-src 'self' https://bextia-agentes-api.onrender.com; img-src 'self' data:; style-src 'self' 'unsafe-inline'; frame-ancestors 'none'"
      - path: /*
        name: X-Frame-Options
        value: DENY
    envVars:
      # Debe ser idéntica a la URL de la API en el connect-src del CSP de arriba; si no, el login queda bloqueado.
      - key: VITE_API_URL
        sync: false
